name: PRIMA

# Instagram non si puo' programmare: Meta non lo permette. Quindi qui c'e' un
# orologio che pubblica al momento. Facebook invece si programma nativamente,
# e questo stesso lavoro tiene piena la coda dei 29 giorni consentiti.
#
# Gli orari sono UTC. Ogni appuntamento ha due partenze, perche' l'ora legale
# italiana sposta tutto di un'ora: quella sbagliata non trova niente e si ferma.

on:
  schedule:
    - cron: '30 17 * * 2'
    - cron: '30 18 * * 2'
    - cron: '0 9 * * 6'
    - cron: '0 10 * * 6'
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prima
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pubblica
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python publish.py
      - name: Salva lo stato
        if: always()
        run: |
          git config user.name  "PRIMA"
          git config user.email "prima@syntonia.invalid"
          git add _state || true
          git diff --staged --quiet || git commit -m "stato $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true
