name: PRIMA

# Instagram non si puo' programmare: Meta non lo permette. Quindi qui c'e' un
# orologio che pubblica al momento. Facebook si programma nativamente, e questo
# stesso lavoro tiene piena la coda dei 29 giorni consentiti.
#
# Orari UTC. Si parte ogni giorno alle due fasce buone piu' due riserve ciascuna,
# perche' l'ora legale sposta tutto di un'ora e perche' un giro puo' andare male.
# Si pubblica solo cio' che e' gia' dovuto: i giri di troppo non trovano niente.

on:
  schedule:
    - cron: '20 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '30 17 * * *'
    - cron: '30 18 * * *'
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prima
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pubblica
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python publish.py
      - name: Salva lo stato
        if: always()
        run: |
          git config user.name  "PRIMA"
          git config user.email "prima@syntonia.invalid"
          git add _state || true
          git diff --staged --quiet || git commit -m "stato $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true
