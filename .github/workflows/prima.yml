name: PRIMA

# Ne' i post ne' le storie di Instagram si possono programmare: Meta non lo
# permette. Quindi qui c'e' un orologio che pubblica al momento giusto.
# Facebook si programma nativamente, e questo stesso lavoro tiene piena la coda
# dei 29 giorni consentiti.
#
# Orari UTC. Ogni appuntamento ha la sua ora legale, la sua ora solare e una
# riserva. Si pubblica solo cio' che e' gia' dovuto e non e' gia' uscito:
# i giri di troppo non trovano niente e si fermano in pochi secondi.
#
#   07:30 / 08:30   storie del mattino  (09:30 italiane)
#   09:00 / 10:00   post del mattino    (11:00 italiane)
#   17:30 / 18:30   post della sera     (19:30 italiane)
#   19:00 / 20:00   storia della sera   (21:00 italiane)
#   06:20           recupero di tutto cio' che fosse rimasto indietro

on:
  schedule:
    - cron: '20 6 * * *'
    - cron: '30 7 * * *'
    - cron: '30 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '30 17 * * *'
    - cron: '30 18 * * *'
    - cron: '0 19 * * *'
    - cron: '30 19 * * *'
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prima
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pubblica
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python publish.py
      - name: Salva lo stato
        if: always()
        run: |
          git config user.name  "PRIMA"
          git config user.email "prima@syntonia.invalid"
          git add _state || true
          git diff --staged --quiet || git commit -m "stato $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true
